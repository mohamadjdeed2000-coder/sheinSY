{% extends 'admin_base.html' %}{% block content %}<div class="heading"><h1>Products</h1><a class="btn" href="{{url_for('add_product')}}">+ Add Product</a></div><form class="filterbar"><input name="q" value="{{q}}" placeholder="Search product, brand or category"><button class="btn">Search</button></form><div class="table-wrap"><table><tr><th>Product</th><th>Category</th><th>Brand</th><th>Price</th><th>Stock</th><th>Actions</th></tr>{% for p in products %}<tr><td>{{p.name}}</td><td><span class="badge">{{p.category}}</span></td><td>{{p.brand}}</td><td>{{ money(p.price) }}</td><td>{{p.stock}}</td><td><a class="mini yellow" href="{{url_for('edit_product',pid=p.id)}}">Edit</a><form class="inline" method="post" action="{{url_for('delete_product',pid=p.id)}}" onsubmit="return confirm('Move product to Trash?')"><button class="mini dark">Trash</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
