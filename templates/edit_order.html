{% extends 'base.html' %}{% block content %}<div class="panel narrow"><h1>Edit Order #{{o.order_no}}</h1><form method="post" class="form"><label>Name<input name="name" value="{{o.name}}" required></label><label>City<input name="city" value="{{o.city}}" required></label><label>Address<textarea name="address" required>{{o.address}}</textarea></label><label>Size<select name="size">{% for x in (p.sizes or '').split(',') %}<option {{'selected' if x.strip()==o.size}}>{{x.strip()}}</option>{% endfor %}</select></label><label>Color<select name="color">{% for x in (p.colors or '').split(',') %}<option {{'selected' if x.strip()==o.color}}>{{x.strip()}}</option>{% endfor %}</select></label><label>Quantity<input type="number" min="1" name="qty" value="{{o.qty}}"></label><label>Notes<textarea name="notes">{{o.notes or ''}}</textarea></label><button class="btn yellow">Save Changes</button></form></div>{% endblock %}
