{% extends 'admin_base.html' %}{% block content %}<h1>Dashboard</h1><div class="stats"><div><b>{{counts.orders}}</b><span>Total Orders</span></div><div><b>{{counts.new}}</b><span>New</span></div><div><b>{{counts.products}}</b><span>Products</span></div><div><b>{{counts.cancelled}}</b><span>Cancelled</span></div></div><form class="filterbar"><input name="q" value="{{q}}" placeholder="Search order, customer, phone, product"><select name="status"><option value="">All statuses</option>{% for s in statuses %}<option value="{{s}}" {{'selected' if status==s}}>{{s}}</option>{% endfor %}</select><button class="btn">Filter</button></form><h2>Latest Orders</h2>{% include '_orders_table.html' %}{% endblock %}
