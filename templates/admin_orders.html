{% extends 'admin_base.html' %}{% block content %}<div class="heading"><h1>Orders <small>({{total}})</small></h1></div><form class="filterbar"><input name="q" value="{{q}}" placeholder="Search order, customer, phone, product"><select name="status"><option value="">All statuses</option>{% for s in statuses %}<option value="{{s}}" {{'selected' if status==s}}>{{s}}</option>{% endfor %}</select><button class="btn">Filter</button></form>{% include '_orders_table.html' %}<div class="pagination">{% if page>1 %}<a href="{{url_for('admin_orders',page=page-1,q=q,status=status)}}">← Previous</a>{% endif %}<span>Page {{page}} / {{pages}}</span>{% if page<pages %}<a href="{{url_for('admin_orders',page=page+1,q=q,status=status)}}">Next →</a>{% endif %}</div>{% endblock %}
