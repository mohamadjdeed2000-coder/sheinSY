{% extends 'base.html' %}{% block content %}<div class="checkout"><h1>{{'إتمام الطلب' if lang=='ar' else 'Checkout'}}</h1><div class="summary"><b>{{p.name}}</b><span>{{size}} · {{color}} · ×{{qty}}</span><strong>{{ money(p.price*qty) }}</strong></div><form method="post" class="form"><input type="hidden" name="size" value="{{size}}"><input type="hidden" name="color" value="{{color}}"><input type="hidden" name="qty" value="{{qty}}"><label>{{'الاسم الكامل' if lang=='ar' else 'Full name'}}<input required name="name"></label><label>{{'رقم الهاتف' if lang=='ar' else 'Phone number'}}<input required name="phone" type="tel"></label><label>{{'المدينة / المنطقة' if lang=='ar' else 'City / Area'}}<input required name="city"></label><label>{{'العنوان بالتفصيل' if lang=='ar' else 'Detailed address'}}<textarea required name="address"></textarea></label><label>{{'ملاحظات' if lang=='ar' else 'Notes (optional)'}}<textarea name="notes"></textarea></label><button class="btn wide">{{'تأكيد الطلب' if lang=='ar' else 'Confirm order'}}</button></form></div>{% endblock %}
